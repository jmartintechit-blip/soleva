name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # wrangler types reads .dev.vars to type the Worker env; tests never use these values.
      - run: cp .dev.vars.example .dev.vars
      - run: npm run check
