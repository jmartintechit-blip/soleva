name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # wrangler types reads .dev.vars to type the Worker env; tests never use these values.
      - run: cp .dev.vars.example .dev.vars
      - run: npm run check

  e2e:
    # Secrets are not passed to forks' pull requests.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEON_PROJECT_ID: dry-mouse-36724862
      BRANCH: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Throwaway copy of the dev branch, never of production (main).
      - id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: dev
          branch_name: ${{ env.BRANCH }}
          database: soleva
          role: soleva_owner
      # No RESEND_API_KEY: in vite dev the code is logged, never emailed.
      - env:
          DB_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          {
            echo "DATABASE_URL=$DB_URL"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)"
            echo "RESEND_API_KEY="
            echo "ALLOWED_EMAILS=delivered@resend.dev"
          } > .dev.vars
          echo "DATABASE_URL=$DB_URL" > .env
      - run: npm run migrate
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - if: always()
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.BRANCH }}
